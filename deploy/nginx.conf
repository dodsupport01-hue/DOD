# =====================================================================
# nginx site config for dodsmarthealth.com  (Hostinger VPS)
#
# Reproduces vercel.json: canonical host, security headers, cache policy,
# pretty-URL redirects, /admin, and /.well-known/security.txt.
#
# This file DEPENDS on deploy/nginx-cache-map.conf, which defines the
# $cache_control variable. Install both (see deploy/README.md).
# =====================================================================

# ---- www -> apex ----------------------------------------------------
# Every <link rel="canonical"> in index.html points at https://dodsmarthealth.com
# (no www), so the server is made to agree. To keep www as canonical instead,
# swap the two server_name values.
server {
    listen 80;
    listen [::]:80;
    server_name www.dodsmarthealth.com;
    return 301 https://dodsmarthealth.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name dodsmarthealth.com;

    root /var/www/dod;
    index index.html;

    # ---------- Security headers (from vercel.json) ----------
    # Declared once, at server level. Cache-Control is driven by the
    # $cache_control map rather than per-location add_header, because a
    # location that declares its own add_header DISCARDS all inherited ones —
    # the classic nginx footgun that would silently drop these headers.
    add_header X-Frame-Options            "SAMEORIGIN"                                   always;
    add_header X-Content-Type-Options     "nosniff"                                      always;
    add_header X-XSS-Protection           "1; mode=block"                                always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"              always;
    add_header Permissions-Policy         "geolocation=(), microphone=(), camera=(self)" always;
    add_header Strict-Transport-Security  "max-age=63072000; includeSubDomains; preload" always;
    add_header Cache-Control              $cache_control                                 always;

    # ---------- Compression ----------
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml
               application/manifest+json;

    # ---------- Pretty-URL redirects (from vercel.json) ----------
    location = /features { return 301 /#features; }
    location = /contact  { return 301 /#contact; }
    location = /gallery  { return 301 /#gallery-view; }
    location = /about    { return 301 /#about; }
    location = /videos   { return 301 /#videos; }

    # ---------- Admin panel ----------
    # `=` and `^~` both take priority over regex locations, so the admin pages
    # are handled here and cannot be swallowed by a generic .html rule.
    location = /admin {
        try_files /admin/index.html =404;
    }
    location ^~ /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # ---------- security.txt ----------
    location = /.well-known/security.txt {
        alias /var/www/dod/security.txt;
        default_type text/plain;
    }

    # ---------- Explicit content types for SEO files ----------
    location = /sitemap.xml          { default_type application/xml; }
    location = /robots.txt           { default_type text/plain; }
    location = /manifest.webmanifest { default_type application/manifest+json; }

    # ---------- Never expose source / config ----------
    location ~ ^/(backend|deploy|\.git|\.github|\.claude|node_modules) {
        deny all;
        return 404;
    }

    # ---------- Everything else ----------
    # Plain multi-file static site: serve the file or 404. Deliberately no SPA
    # catch-all, which would mask real 404s and hurt SEO.
    location / {
        try_files $uri $uri/ =404;
    }
}
