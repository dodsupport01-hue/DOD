# =====================================================================
# Cache-Control policy, keyed off the request path.
#
# This is a `map`, which must live at http{} level — NOT inside a server{}.
# Install it into /etc/nginx/conf.d/ (which nginx includes from http{}):
#
#   sudo cp deploy/nginx-cache-map.conf /etc/nginx/conf.d/dod-cache.conf
#
# The site config (deploy/nginx.conf) then emits it with a single
# server-level `add_header Cache-Control $cache_control`.
#
# Why a map instead of per-location add_header: in nginx, a location that
# declares its own add_header discards every inherited one. Setting cache
# headers per-location would therefore silently drop the security headers.
# =====================================================================

map $uri $cache_control {
    # Anything not matched below: revalidate every time.
    default  "public, max-age=0, must-revalidate";

    # HTML: always revalidate, so content and SEO updates land immediately.
    ~*\.html$  "public, max-age=0, must-revalidate";

    # Images + fonts: content rarely changes under the same name — cache a year.
    ~*\.(png|jpe?g|webp|gif|svg|ico|woff2?)$  "public, max-age=31536000, immutable";

    # CSS / JS: one day, then revalidate. These filenames are NOT content-hashed,
    # so they must not be immutable or users would be stuck on stale assets.
    ~*\.(css|js)$  "public, max-age=86400, must-revalidate";

    # SEO / manifest files: one hour.
    ~*^/(sitemap\.xml|robots\.txt|manifest\.webmanifest)$  "public, max-age=3600";
}
